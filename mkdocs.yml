site_name: Digitális eszköztár
site_description: Rövid, kereshető segítség digitális feladatokhoz
site_url: https://bsuszter.github.io/digitalis-eszkoztar/

theme:
  name: material
  language: hu
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: blue grey
      accent: indigo

plugins:
  - search:
      lang: hu

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

nav:
  - Kezdőlap: index.md
  - 3D tervezés:
      - Tinkercad: tinkercad/index.md
      - Navigáció: tinkercad/navigacio.md
      - Méretezés és igazítás: tinkercad/meretezes.md
      - Furat készítése: tinkercad/furat.md
