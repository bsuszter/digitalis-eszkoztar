site_name: Digitális eszköztár
site_description: Rövid, kereshető segítség digitális feladatokhoz
site_url: https://bsuszter.github.io/digitalis-eszkoztar/

theme:
  name: material
  language: hu
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: blue grey
      accent: indigo

plugins:
  - search:
      lang: hu
  - redirects:
      redirect_maps:
        tinkercad/index.md: eszkoztar/tinkercad/index.md
        tinkercad/navigacio.md: eszkoztar/tinkercad/navigacio.md
        tinkercad/alakzatok-munkasik.md: eszkoztar/tinkercad/alakzatok-munkasik.md
        tinkercad/mozgas-forgatas-emeles.md: eszkoztar/tinkercad/mozgas-forgatas-emeles.md
        tinkercad/meretezes.md: eszkoztar/tinkercad/meretezes.md
        tinkercad/furat.md: eszkoztar/tinkercad/furat.md
        tinkercad/csoportositas.md: eszkoztar/tinkercad/csoportositas.md
        tinkercad/masolas-ismetles.md: eszkoztar/tinkercad/masolas-ismetles.md
        tinkercad/szoveg.md: eszkoztar/tinkercad/szoveg.md
        tinkercad/szabadkezi-rajzolas.md: eszkoztar/tinkercad/szabadkezi-rajzolas.md
        tinkercad/kesz-modellek.md: eszkoztar/tinkercad/kesz-modellek.md
        tinkercad/importalas.md: eszkoztar/tinkercad/importalas.md
        tinkercad/kollaboracio.md: eszkoztar/tinkercad/kollaboracio.md
        tinkercad/nyomtatas-elokeszites.md: eszkoztar/tinkercad/nyomtatas-elokeszites.md
        tinkercad/exportalas-stl.md: eszkoztar/tinkercad/exportalas-stl.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css
  - stylesheets/link-cards.css
  - stylesheets/nav-highlight.css

extra_javascript:
  - javascripts/nav-accordion.js

nav:
  - Kezdőlap: index.md
  - Tananyagok:
      - Áttekintés: tananyagok/index.md
      - Digitális kultúra:
          - Áttekintés: tananyagok/digitalis-kultura/index.md
          - 5. évfolyam:
              - Áttekintés: tananyagok/digitalis-kultura/5-evfolyam/index.md
              - 3D tervezés – Saját játékfigura:
                  - Projekt áttekintés: tananyagok/digitalis-kultura/5-evfolyam/3d-avatar/index.md
                  - 1. Találd ki az avatarodat!: tananyagok/digitalis-kultura/5-evfolyam/3d-avatar/01-talald-ki-az-avatarod.md
                  - 2. Építsd fel Tinkercadben!: tananyagok/digitalis-kultura/5-evfolyam/3d-avatar/02-epitsd-fel.md
          - 6. évfolyam: tananyagok/digitalis-kultura/6-evfolyam/index.md
          - 7. évfolyam: tananyagok/digitalis-kultura/7-evfolyam/index.md
          - 8. évfolyam:
              - Áttekintés: tananyagok/digitalis-kultura/8-evfolyam/index.md
              - 3D tervezés és nyomtatás:
                  - Projekt áttekintés: tananyagok/digitalis-kultura/8-evfolyam/3d-tervezes/index.md
                  - 1. Találj egy problémát!: tananyagok/digitalis-kultura/8-evfolyam/3d-tervezes/01-talalj-egy-problemat.md
                  - 2. Készíts pontos tervet!: tananyagok/digitalis-kultura/8-evfolyam/3d-tervezes/02-keszits-pontos-tervet.md
                  - 3. Modellezd meg!: tananyagok/digitalis-kultura/8-evfolyam/3d-tervezes/03-modellezd-meg.md
                  - 4. Készítsd elő a nyomtatásra!: tananyagok/digitalis-kultura/8-evfolyam/3d-tervezes/04-keszitsd-elo-a-nyomtatasra.md
                  - 5. Próbáld ki és javítsd!: tananyagok/digitalis-kultura/8-evfolyam/3d-tervezes/05-probald-ki-es-javitsd.md
      - Nyelvtan:
          - Áttekintés: tananyagok/nyelvtan/index.md
          - 5. évfolyam: tananyagok/nyelvtan/5-evfolyam/index.md
          - 6. évfolyam: tananyagok/nyelvtan/6-evfolyam/index.md
          - 7. évfolyam: tananyagok/nyelvtan/7-evfolyam/index.md
          - 8. évfolyam: tananyagok/nyelvtan/8-evfolyam/index.md
      - Irodalom:
          - Áttekintés: tananyagok/irodalom/index.md
          - 5. évfolyam: tananyagok/irodalom/5-evfolyam/index.md
          - 6. évfolyam: tananyagok/irodalom/6-evfolyam/index.md
          - 7. évfolyam: tananyagok/irodalom/7-evfolyam/index.md
          - 8. évfolyam: tananyagok/irodalom/8-evfolyam/index.md
      - Szakkörök: tananyagok/szakkorok/index.md
  - Digitális eszköztár:
      - Áttekintés: eszkoztar/index.md
      - Flowgorithm:
          - Áttekintés: eszkoztar/flowgorithm/index.md
          - Kezdés:
              - Flowgorithm indítása: eszkoztar/flowgorithm/inditas.md
              - Választható elemek: eszkoztar/flowgorithm/valaszthato-elemek.md
              - Szöveg kiírása: eszkoztar/flowgorithm/szoveg-kiirasa.md
          - Adatok és változók:
              - Deklarálás (változó): eszkoztar/flowgorithm/deklaralas.md
              - Adat beolvasása és felhasználása: eszkoztar/flowgorithm/beolvasas.md
          - Döntések és feltételek:
              - Elágazás: eszkoztar/flowgorithm/elagazas.md
          - Ciklusok:
              - Végtelen ciklus: eszkoztar/flowgorithm/vegtelen-ciklus.md
      - Tinkercad:
          - Áttekintés: eszkoztar/tinkercad/index.md
          - Kezdés:
              - Bejelentkezés és csatlakozás: eszkoztar/tinkercad/bejelentkezes.md
              - Új 3D terv létrehozása: eszkoztar/tinkercad/uj-terv.md
              - Navigáció: eszkoztar/tinkercad/navigacio.md
          - Alapműveletek:
              - Visszavonás és gyors szerkesztés: eszkoztar/tinkercad/gyors-szerkesztes.md
              - Alakzatok és munkasík: eszkoztar/tinkercad/alakzatok-munkasik.md
              - Mozgatás, forgatás és emelés: eszkoztar/tinkercad/mozgas-forgatas-emeles.md
              - Méretezés és igazítás: eszkoztar/tinkercad/meretezes.md
          - Alakítás és szerkesztés:
              - Csoportosítás és szétbontás: eszkoztar/tinkercad/csoportositas.md
              - Furat készítése: eszkoztar/tinkercad/furat.md
              - Másolás és ismétlés: eszkoztar/tinkercad/masolas-ismetles.md
              - Szöveg és felirat: eszkoztar/tinkercad/szoveg.md
              - Szabadkézi rajzolás – Scribble: eszkoztar/tinkercad/szabadkezi-rajzolas.md
          - Kész és külső elemek:
              - Kész modellek keresése és beillesztése: eszkoztar/tinkercad/kesz-modellek.md
              - Importálás: eszkoztar/tinkercad/importalas.md
          - Együttműködés:
              - Kollaboráció: eszkoztar/tinkercad/kollaboracio.md
          - 3D nyomtatás:
              - 3D nyomtatásra előkészítés: eszkoztar/tinkercad/nyomtatas-elokeszites.md
              - Exportálás STL-be: eszkoztar/tinkercad/exportalas-stl.md
