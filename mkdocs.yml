site_name: Digitális eszköztár
site_description: Rövid, kereshető segítség digitális feladatokhoz
site_url: https://bsuszter.github.io/digitalis-eszkoztar/

theme:
  name: material
  language: hu
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: blue grey
      accent: indigo

plugins:
  - search:
      lang: hu

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

nav:
  - Kezdőlap: index.md
  - Tananyagok:
      - Áttekintés: tananyagok/index.md
      - Digitális kultúra:
          - Áttekintés: tananyagok/digitalis-kultura/index.md
          - 5. évfolyam: tananyagok/digitalis-kultura/5-evfolyam/index.md
          - 6. évfolyam: tananyagok/digitalis-kultura/6-evfolyam/index.md
          - 7. évfolyam: tananyagok/digitalis-kultura/7-evfolyam/index.md
          - 8. évfolyam:
              - Áttekintés: tananyagok/digitalis-kultura/8-evfolyam/index.md
              - 3D tervezés és nyomtatás:
                  - Projekt áttekintés: tananyagok/digitalis-kultura/8-evfolyam/3d-tervezes/index.md
                  - 1. Találj egy problémát!: tananyagok/digitalis-kultura/8-evfolyam/3d-tervezes/01-talalj-egy-problemat.md
      - Nyelvtan:
          - Áttekintés: tananyagok/nyelvtan/index.md
          - 5. évfolyam: tananyagok/nyelvtan/5-evfolyam/index.md
          - 6. évfolyam: tananyagok/nyelvtan/6-evfolyam/index.md
          - 7. évfolyam: tananyagok/nyelvtan/7-evfolyam/index.md
          - 8. évfolyam: tananyagok/nyelvtan/8-evfolyam/index.md
      - Irodalom:
          - Áttekintés: tananyagok/irodalom/index.md
          - 5. évfolyam: tananyagok/irodalom/5-evfolyam/index.md
          - 6. évfolyam: tananyagok/irodalom/6-evfolyam/index.md
          - 7. évfolyam: tananyagok/irodalom/7-evfolyam/index.md
          - 8. évfolyam: tananyagok/irodalom/8-evfolyam/index.md
      - Szakkörök: tananyagok/szakkorok/index.md
  - Digitális eszköztár:
      - Áttekintés: eszkoztar/index.md
      - Tinkercad:
          - Áttekintés: tinkercad/index.md
          - Alapműveletek:
              - Navigáció: tinkercad/navigacio.md
              - Alakzatok és munkasík: tinkercad/alakzatok-munkasik.md
              - Mozgatás, forgatás és emelés: tinkercad/mozgas-forgatas-emeles.md
              - Méretezés és igazítás: tinkercad/meretezes.md
          - Alakítás és szerkesztés:
              - Furat készítése: tinkercad/furat.md
              - Csoportosítás és szétbontás: tinkercad/csoportositas.md
              - Másolás és ismétlés: tinkercad/masolas-ismetles.md
              - Szöveg és felirat: tinkercad/szoveg.md
              - Szabadkézi rajzolás – Scribble: tinkercad/szabadkezi-rajzolas.md
          - Kész és külső elemek:
              - Kész modellek keresése és beillesztése: tinkercad/kesz-modellek.md
              - Importálás: tinkercad/importalas.md
          - Együttműködés:
              - Kollaboráció: tinkercad/kollaboracio.md
          - 3D nyomtatás:
              - 3D nyomtatásra előkészítés: tinkercad/nyomtatas-elokeszites.md
              - Exportálás STL-be: tinkercad/exportalas-stl.md
