<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online etikett</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="customizations.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div class="eyebrow">ONLINE IRÁNYTŰ</div>
      <h1>🌐 Online etikett</h1>
      <p>Valódi online helyzetekben kell észrevenned, mi számít igazán.</p>
      <div class="meta-row">
        <span>⏱️ 15–20 perc</span>
        <span>👤 Önálló munka</span>
        <span>⭐ 12 pont</span>
      </div>
    </header>

    <div class="learning-bar">
      <nav class="progress" aria-label="A tanulási útvonal">
        <button class="step is-active" data-step="0"><b>1</b><span>Indulás</span></button>
        <button class="step" data-step="1"><b>2</b><span>Megnyitás</span></button>
        <button class="step" data-step="2"><b>3</b><span>Írás</span></button>
        <button class="step" data-step="3"><b>4</b><span>Megosztás</span></button>
        <button class="step" data-step="4"><b>5</b><span>AI</span></button>
        <button class="step" data-step="5"><b>6</b><span>Iránytű</span></button>
      </nav>
      <aside class="score-tracker" aria-live="polite">
        <span>Pontjaid</span>
        <strong><span id="liveScore">0</span>/12</strong>
        <div class="score-meter"><span id="scoreFill"></span></div>
      </aside>
    </div>

    <section id="screen" class="screen" aria-live="polite"></section>
  </main>

  <script src="data.js"></script>
  <script src="customizations.js"></script>
  <script src="app.js"></script>
  <script src="scorm.js"></script>
  <script src="scorm-bridge.js"></script>
</body>
</html>
