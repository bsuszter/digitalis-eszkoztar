<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-mail-küldetés – SCORM</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #eef9fb;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #eef9fb;
    }
  </style>
  <script src="js/scorm-helper.js"></script>
</head>
<body>
  <iframe
    id="email-mission-frame"
    src="index.html"
    title="E-mail-küldetés"
    allow="clipboard-write"
  ></iframe>

  <script>
    (function () {
      const frame = document.querySelector("#email-mission-frame");

      frame.addEventListener("load", function () {
        try {
          frame.contentDocument.addEventListener("click", function (event) {
            const target = event.target;
            if (target instanceof frame.contentWindow.Element && target.closest("#review-letter")) {
              window.EmailMissionSCORM?.markCompleted();
            }
          });
        } catch (error) {
          console.warn("A SCORM-indító nem tudta figyelni a belső oldalt.", error);
        }
      });
    })();
  </script>
</body>
</html>
