<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" role="img" aria-labelledby="title desc">
  <title id="title">Cserélhető KRESZ-tábla rendszer műszaki méretei</title>
  <desc id="desc">Méretezett rajz a 3,5 milliméteres oszlopról, az 5×5×8 milliméteres csatlakozócsapról és az 5,5×5,5 milliméteres, 9 milliméter mély foglalatról.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#315f78"/></marker>
    <style>
      .solid{fill:#dbeaf2;stroke:#315f78;stroke-width:2.2}.hole{fill:#fff;stroke:#735c9a;stroke-width:2.2;stroke-dasharray:7 5}.dim{stroke:#315f78;stroke-width:1.5;marker-start:url(#arrow);marker-end:url(#arrow)}.ext{stroke:#8aa6b7;stroke-width:1}.txt{font:16px Arial,sans-serif;fill:#263746}.small{font:14px Arial,sans-serif;fill:#526773}.head{font:bold 19px Arial,sans-serif;fill:#285a77}.label{font:bold 15px Arial,sans-serif;fill:#604d80}
    </style>
  </defs>
  <rect x="1" y="1" width="978" height="598" rx="18" fill="#fff" stroke="#d8e2e8"/>
  <text x="34" y="42" class="head">1. Tábla + oszlop + csatlakozó + foglalat</text>
  <text x="34" y="68" class="small">A rajz arányosan mutatja a kötött méreteket; minden méret mm-ben értendő.</text>

  <g transform="translate(95,115)">
    <circle cx="100" cy="62" r="48" class="solid"/>
    <line x1="100" y1="110" x2="100" y2="326" stroke="#315f78" stroke-width="14" stroke-linecap="round"/>
    <rect x="90" y="326" width="20" height="32" class="solid"/>
    <line x1="36" y1="358" x2="164" y2="358" stroke="#263746" stroke-width="3"/>
    <text x="47" y="392" class="label">összeállított tábla</text>
    <line x1="15" y1="62" x2="15" y2="358" class="dim"/>
    <line x1="22" y1="62" x2="100" y2="62" class="ext"/><line x1="22" y1="358" x2="90" y2="358" class="ext"/>
    <text x="-5" y="215" class="txt" transform="rotate(-90 -5 215)">58 – táblaközép</text>
    <line x1="52" y1="0" x2="148" y2="0" class="dim"/>
    <line x1="52" y1="8" x2="52" y2="25" class="ext"/><line x1="148" y1="8" x2="148" y2="25" class="ext"/>
    <text x="79" y="-9" class="txt">Ø 24</text>
  </g>

  <g transform="translate(385,120)">
    <text x="0" y="0" class="label">oszlop és alsó csatlakozó</text>
    <rect x="95" y="42" width="14" height="230" rx="7" class="solid"/>
    <rect x="92" y="272" width="20" height="32" class="solid"/>
    <line x1="72" y1="74" x2="132" y2="74" class="dim"/><text x="140" y="79" class="txt">Ø 3,5</text>
    <line x1="92" y1="326" x2="112" y2="326" class="dim"/>
    <line x1="92" y1="308" x2="92" y2="334" class="ext"/><line x1="112" y1="308" x2="112" y2="334" class="ext"/>
    <text x="84" y="352" class="txt">5 × 5</text>
    <line x1="144" y1="272" x2="144" y2="304" class="dim"/>
    <line x1="115" y1="272" x2="152" y2="272" class="ext"/><line x1="115" y1="304" x2="152" y2="304" class="ext"/>
    <text x="156" y="293" class="txt">8</text>
    <text x="0" y="390" class="small">A négyzetes csap megakadályozza az elfordulást.</text>
  </g>

  <g transform="translate(675,120)">
    <text x="0" y="0" class="label">foglalat különálló talpban</text>
    <rect x="15" y="210" width="220" height="50" class="solid"/>
    <rect x="85" y="150" width="80" height="60" class="solid"/>
    <rect x="114" y="150" width="22" height="54" class="hole"/>
    <line x1="15" y1="282" x2="235" y2="282" class="dim"/>
    <line x1="15" y1="262" x2="15" y2="290" class="ext"/><line x1="235" y1="262" x2="235" y2="290" class="ext"/>
    <text x="96" y="307" class="txt">max. 25</text>
    <line x1="114" y1="126" x2="136" y2="126" class="dim"/>
    <line x1="114" y1="134" x2="114" y2="150" class="ext"/><line x1="136" y1="134" x2="136" y2="150" class="ext"/>
    <text x="94" y="112" class="txt">5,5 × 5,5</text>
    <line x1="184" y1="150" x2="184" y2="204" class="dim"/>
    <line x1="141" y1="150" x2="192" y2="150" class="ext"/><line x1="141" y1="204" x2="192" y2="204" class="ext"/>
    <text x="196" y="182" class="txt">9 mély</text>
    <text x="15" y="340" class="small">Talplemez: 3 mm.</text>
    <text x="15" y="362" class="small">A foglalat körül legalább 11 mm teljes</text>
    <text x="15" y="384" class="small">magasságú megerősített rész szükséges.</text>
  </g>

  <rect x="34" y="520" width="912" height="48" rx="10" fill="#fff9ed" stroke="#ead6a7"/>
  <text x="52" y="550" class="txt">Kötött: Ø3,5 oszlop · 5×5×8 csap · 5,5×5,5×9 foglalat.  Szabad: a talp külső formája.</text>
</svg>