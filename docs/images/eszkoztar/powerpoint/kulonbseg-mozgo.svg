<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 405" role="img" aria-label="Balra tájképes fotó úszik be egy változatlan diára; jobbra új dia tolja ki a régit"><defs><clipPath id="left"><rect x="61" y="110" width="379" height="218" rx="7"/></clipPath><clipPath id="right"><rect x="543" y="110" width="378" height="218" rx="7"/></clipPath><style>text{font-family:Arial,Helvetica,sans-serif;fill:#263746}.hd{font-size:25px;font-weight:700}.note{font-size:16px;fill:#607580}.picture{animation:photoIn 9s infinite ease-in-out}.slide{animation:slideIn 9s infinite ease-in-out}@keyframes photoIn{0%,12%{transform:translateX(-270px);opacity:0}27%,60%{transform:translateX(0);opacity:1}75%,100%{transform:translateX(-270px);opacity:0}}@keyframes slideIn{0%,38%{transform:translateX(380px)}54%,80%{transform:translateX(0)}96%,100%{transform:translateX(380px)}}@media(prefers-reduced-motion:reduce){.picture,.slide{animation:none}.picture,.slide{transform:none;opacity:1}}</style></defs><rect width="980" height="405" rx="23" fill="#f4f9fb"/><rect x="23" y="28" width="454" height="335" rx="16" fill="#fff" stroke="#d6e5eb" stroke-width="2"/><rect x="503" y="28" width="454" height="335" rx="16" fill="#fff" stroke="#d6e5eb" stroke-width="2"/><text x="46" y="63" class="hd">Animáció: beúszás</text><text x="526" y="63" class="hd">Áttűnés: tolás</text><text x="46" y="88" class="note">Egy kép érkezik, a dia nem változik.</text><text x="526" y="88" class="note">Egy teljesen új dia érkezik.</text><rect x="61" y="110" width="379" height="218" rx="7" fill="#fff6e8" stroke="#d5dfdf"/><g clip-path="url(#left)"><text x="82" y="150" font-size="24" font-weight="700">Kedvenc helyem</text><text x="83" y="181" font-size="16">Egy kép beúszik a diára.</text><g class="picture"><rect x="120" y="203" width="252" height="104" rx="7" fill="#bce4ed" stroke="#5d9bb0" stroke-width="2"/><circle cx="310" cy="231" r="14" fill="#f4d079"/><path d="M120 297l61-72 47 51 48-43 96 74H120" fill="#66a695"/><path d="M120 30