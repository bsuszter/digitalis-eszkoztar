  <p style="margin:0 0 10px;">Tölts fel <strong>egy képernyőképet</strong> az elkészült Tinkercad-alapmodelledről!</p>
  <p style="margin:0;">Írj mellé 1–2 mondatot arról, <strong>hová kerül majd a plusz funkció, és mihez fog kapcsolódni</strong>. A Tinkercad-tervet ne töröld és ne kezdd újra: a következő mérföldkőben ugyanezen a modellen dolgozol tovább.</p>
