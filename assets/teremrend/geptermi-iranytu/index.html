<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Géptermi iránytű</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="illustrations.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div class="eyebrow">TELJES ÚTVONAL</div>
      <h1>🧭 Géptermi iránytű</h1>
      <p>Ismerd meg a biztonságos, felelős és egymásra figyelő géptermi munka alapjait!</p>
      <div class="meta-row">
        <span>⏱️ 20–25 perc</span>
        <span>👤 Önálló munka</span>
        <span>⭐ 17 pont</span>
      </div>
    </header>

    <div class="learning-bar">
      <nav class="progress" aria-label="A tanulási útvonal">
        <button class="step is-active" data-step="0"><b>1</b><span>Indulás</span></button>
        <button class="step" data-step="1"><b>2</b><span>Szabályépítő</span></button>
        <button class="step" data-step="2"><b>3</b><span>Mi történhet?</span></button>
        <button class="step" data-step="3"><b>4</b><span>Helyzetek</span></button>
        <button class="step" data-step="4"><b>5</b><span>Vállalásaink</span></button>
        <button class="step" data-step="5"><b>6</b><span>Iránytű</span></button>
      </nav>

      <aside id="scoreTracker" class="score-tracker" aria-live="polite">
        <span class="score-label">Pontjaid</span>
        <strong><span id="liveScore">0</span>/17</strong>
        <div class="score-meter" aria-hidden="true"><span id="scoreMeterFill"></span></div>
      </aside>
    </div>

    <section id="screen" class="screen" aria-live="polite"></section>
  </main>

  <script src="data.js"></script>
  <script src="scorm.js"></script>
  <script src="app.js"></script>
  <script src="scorm-bridge.js"></script>
  <script src="score-tracker.js"></script>
  <script src="illustrations.js"></script>
</body>
</html>
