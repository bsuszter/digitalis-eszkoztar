<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" role="img" aria-label="Egy dia, két megoldás: melyik olvasható?"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#263746}.h{font-size:23px;font-weight:700}.muted{fill:#637580}</style><rect width="980" height="380" rx="22" fill="#f4f9fb"/><rect x="22" y="28" width="936" height="324" rx="16" fill="white" stroke="#d3e3eb" stroke-width="2"/><text x="44" y="64" class="h">Egy dia, két megoldás: melyik olvasható?</text><rect x="56" y="102" width="407" height="226" rx="14" fill="#fff7f2" stroke="#e1c5b5"/><text x="76" y="128" font-size="19" font-weight="700">Túl sok apró szöveg</text><rect x="88" y="147" width="340" height="145" rx="5" fill="#efe6d2"/><text x="104" y="171" font-size="15" font-weight="700" fill="#b9a584">A fák</text><rect x="104" y="180" width="275" height="5" rx="2" fill="#b9a584"/><rect x="104" y="191" width="306" height="5" rx="2" fill="#b9a584"/><rect x="104" y="202" width="245" height="5" rx="2" fill="#b9a584"/><rect x="104" y="213" width="275" height="5" rx="2" fill="#b9a584"/><rect x="104" y="224" width="306" height="5" rx="2" fill="#b9a584"/><rect x="104" y="235" width="245" height="5" rx="2" fill="#b9a584"/><rect x="104" y="246" width="275" height="5" rx="2" fill="#b9a584"/><rect x="104" y="257" width="306" height="5" rx="2" fill="#b9a584"/><rect x="494" y="102" width="431" height="226" rx="14" fill="#f1f9f3" stroke="#c9e3d2"/><text x="516" y="128" font-size="19" font-weight="700">Kiemelt lényeg, nagyobb betűk</text><rect x="528" y="147" width="356" height="145" rx="5" fill="#f4f8ff"/><text x="549" y="185" font-size="25" font-weight="700" fill="#284d70">Miért fontosak a fák?</text><circle cx="563" cy="216" r="5" fill="#4f8768"/><text x="580" y="222" font-size="19">Oxigént termelnek</text><circle cx="563" cy="253" r="5" fill="#4f8768"/><text x="580" y="259" font-size="19">Árnyékot adnak</text></svg>