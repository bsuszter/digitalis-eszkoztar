<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 385" role="img" aria-label="Mozgó szemléltetés: balra egy kép jelenik meg ugyanazon dián, jobbra teljes dia vált"><defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#263746}.hd{font-size:25px;font-weight:700}.note{font-size:16px;fill:#607580}.elem{animation:elem 8s infinite}.next{animation:next 8s infinite}.second{animation:second 8s infinite}@keyframes elem{0%,13%{opacity:0;transform:translateY(22px)}23%,62%{opacity:1;transform:translateY(0)}73%,100%{opacity:0;transform:translateY(22px)}}@keyframes next{0%,38%{opacity:0}50%,75%{opacity:1}90%,100%{opacity:0}}@keyframes second{0%,38%{opacity:1}50%,75%{opacity:0}90%,100%{opacity:1}}@media(prefers-reduced-motion:reduce){.elem,.next,.second{animation:none}.elem,.next{opacity:1}.second{opacity:0}}</style></defs><rect width="980" height="385" rx="23" fill="#f4f9fb"/><rect x="23" y="28" width="454" height="320" rx="16" fill="#fff" stroke="#d6e5eb" stroke-width="2"/><rect x="503" y="28" width="454" height="320" rx="16" fill="#fff" stroke="#d6e5eb" stroke-width="2"/><text x="46" y="64" class="hd">Animáció</text><text x="526" y="64" class="hd">Áttűnés</text><text x="46" y="88" class="note">Egy elem mozog ugyanazon a dián.</text><text x="526" y="88" class="note">A teljes dia változik.</text><rect x="60" y="106" width="380" height="208" rx="7" fill="#e8f5f2" stroke="#bcd6d2"/><text x="82" y="150" font-size="23" font-weight="700">Kedvencem: a természet</text><text x="83" y="186" font-size="16">A háttér és a cím változatlan.</text><g class="elem"><circle cx="258" cy="250" r="43" fill="#f3ca7d" stroke="#b98a39" stroke-width="4"/><path d="M222 250l25 20 49-49" fill="none" stroke="#3b7d64" stroke-width="7" stroke-linecap="round"/></g><rect x="542" y="106" width="378" height="208" rx="7" fill="#deebf5" stroke="#bed1e5"/><g class="second"><text x="567" y="155" font-size="26" font-weight="700">1. dia</text><path d="M565 280l86-115 79 94 62-61 107 104H565" fill="#74a9d7"/></g><g class="next"><rect x="542" y="106" width="378" height="208" fill="#f4e8fa"/><text x="567" y="155" font-size="26" font-weight="700">2. dia</text><circle cx="753" cy="224" r="65" fill="#ccade1"/><path d="M712 224l28 27 55-61" fill="none" stroke="#735c9a" stroke-width="9" stroke-linecap="round"/></g><text x="48" y="370" class="note">Szemléltető animáció, nem PowerPoint-képernyőfelvétel.</text></svg>