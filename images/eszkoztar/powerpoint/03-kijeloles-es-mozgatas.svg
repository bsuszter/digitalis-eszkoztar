<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" role="img" aria-label="Kétféle kattintás: szöveg vagy szövegdoboz"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#263746}.h{font-size:23px;font-weight:700}.muted{fill:#637580}</style><rect width="980" height="380" rx="22" fill="#f4f9fb"/><rect x="22" y="28" width="936" height="324" rx="16" fill="white" stroke="#d3e3eb" stroke-width="2"/><text x="44" y="64" class="h">Kétféle kattintás: szöveg vagy szövegdoboz</text><rect x="55" y="95" width="408" height="232" rx="14" fill="#f1f9f3" stroke="#c9e3d2"/><text x="77" y="127" font-size="21" font-weight="700">A szöveg kijelölése</text><rect x="90" y="155" width="339" height="111" rx="5" fill="#fff" stroke="#aabec8" stroke-width="2"/><rect x="104" y="177" width="294" height="37" rx="3" fill="#cceafa"/><text x="114" y="204" font-size="20">A kedvenc állatom</text><text x="87" y="296" font-size="17">Betűméretet, színt, stílust állítasz.</text><rect x="495" y="95" width="429" height="232" rx="14" fill="#edf6fb" stroke="#c3dbe8"/><text x="517" y="127" font-size="21" font-weight="700">A doboz keretének kijelölése</text><rect x="543" y="157" width="324" height="107" rx="3" fill="#fff" stroke="#376f93" stroke-width="3" stroke-dasharray="6 4"/><g fill="#fff" stroke="#376f93" stroke-width="2"><rect x="538" y="152" width="10" height="10"/><rect x="862" y="152" width="10" height="10"/><rect x="538" y="259" width="10" height="10"/><rect x="862" y="259" width="10" height="10"/></g><text x="567" y="218" font-size="20">A kedvenc állatom</text><text x="515" y="296" font-size="17">Helyét és méretét változtatod.</text></svg>