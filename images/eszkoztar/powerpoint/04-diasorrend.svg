<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" role="img" aria-label="PowerPoint bal oldali dianézet és az új dia helye"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#263746}.h{font-size:23px;font-weight:700}.p{font-size:17px;fill:#637580}</style><rect width="980" height="380" rx="22" fill="#f4f9fb"/><rect x="22" y="28" width="936" height="324" rx="16" fill="#fff" stroke="#d3e3eb" stroke-width="2"/><text x="44" y="63" class="h">A bal oldali diasor dönti el, hová kerül az új dia.</text><rect x="51" y="91" width="224" height="235" rx="13" fill="#f5f8fa" stroke="#d4e3ea"/><rect x="84" y="110" width="156" height="84" rx="5" fill="#fff" stroke="#6fa29d" stroke-width="3"/><text x="99" y="136" font-size="15">1.</text><text x="116" y="155" font-size="18" font-weight="700">A kedvencem</text><rect x="84" y="214" width="156" height="84" rx="5" fill="#fff" stroke="#d4e3ea" stroke-width="2"/><text x="99" y="240" font-size="15">2.</text><text x="116" y="258" font-size="17">Bemutatás</text><path d="M289 153h84" stroke="#376f93" stroke-width="4"/><path d="M362 146l14 7-14 7" fill="none" stroke="#376f93" stroke-width="4"/><rect x="397" y="101" width="511" height="210" rx="13" fill="#eaf4f7" stroke="#bed7e3"/><text x="422" y="150" font-size="22" font-weight="700">Ha az 1. diát jelölöd ki...</text><text x="422" y="190" font-size="19">...és az Új dia gombra kattintasz,</text><text x="422" y="227" font-size="19">az új dia rendszerint az 1. után kerül.</text><text x="422" y="275" font-size="18" fill="#607580">A diák sorrendje később is módosítható.</text></svg>