<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">KRESZ táblalakok szabványos modellméretei</title>
  <desc id="desc">A kör, négyzet, háromszög, nyolcszög és téglalap alakú táblák egységes modellméretei.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#315f78"/></marker>
    <style>.shape{fill:#f4f9fb;stroke:#315f78;stroke-width:3}.dim{stroke:#315f78;stroke-width:1.5;marker-start:url(#arrow);marker-end:url(#arrow)}.ext{stroke:#91a9b8;stroke-width:1}.txt{font:16px Arial,sans-serif;fill:#263746}.small{font:14px Arial,sans-serif;fill:#526773}.head{font:bold 19px Arial,sans-serif;fill:#285a77}.label{font:bold 16px Arial,sans-serif;fill:#604d80}</style>
  </defs>
  <rect x="1" y="1" width="978" height="428" rx="18" fill="#fff" stroke="#d8e2e8"/>
  <text x="34" y="42" class="head">2. A táblalapok egységes méretei</text>
  <text x="34" y="68" class="small">Minden táblalap 2 mm vastag; a táblaközép minden típusnál azonos magasságba kerül.</text>

  <g transform="translate(62,108)">
    <text x="42" y="0" class="label">Kör</text>
    <circle cx="70" cy="105" r="48" class="shape"/>
    <line x1="22" y1="178" x2="118" y2="178" class="dim"/><line x1="22" y1="154" x2="22" y2="186" class="ext"/><line x1="118" y1="154" x2="118" y2="186" class="ext"/>
    <text x="48" y="204" class="txt">Ø 24</text>
  </g>

  <g transform="translate(235,108)">
    <text x="35" y="0" class="label">Négyzet</text>
    <rect x="22" y="57" width="96" height="96" class="shape"/>
    <line x1="22" y1="178" x2="118" y2="178" class="dim"/><line x1="22" y1="154" x2="22" y2="186" class="ext"/><line x1="118" y1="154" x2="118" y2="186" class="ext"/>
    <text x="44" y="204" class="txt">24 × 24</text>
  </g>

  <g transform="translate(410,108)">
    <text x="25" y="0" class="label">Háromszög</text>
    <polygon points="70,44 14,153 126,153" class="shape"/>
    <line x1="14" y1="178" x2="126" y2="178" class="dim"/><line x1="14" y1="154" x2="14" y2="186" class="ext"/><line x1="126" y1="154" x2="126" y2="186" class="ext"/>
    <text x="30" y="204" class="txt">28 oldalhossz</text>
  </g>

  <g transform="translate(595,108)">
    <text x="45" y="0" class="label">STOP</text>
    <polygon points="42,50 98,50 126,78 126,134 98,162 42,162 14,134 14,78" class="shape"/>
    <line x1="14" y1="188" x2="126" y2="188" class="dim"/><line x1="14" y1="163" x2="14" y2="196" class="ext"/><line x1="126" y1="163" x2="126" y2="196" class="ext"/>
    <text x="20" y="214" class="txt">26 átellenes oldalak</text>
  </g>

  <g transform="translate(790,108)">
    <text x="25" y="0" class="label">Téglalap</text>
    <rect x="10" y="65" width="120" height="80" class="shape"/>
    <line x1="10" y1="178" x2="130" y2="178" class="dim"/><line x1="10" y1="146" x2="10" y2="186" class="ext"/><line x1="130" y1="146" x2="130" y2="186" class="ext"/>
    <text x="40" y="204" class="txt">30 × 20</text>
  </g>

  <rect x="34" y="344" width="912" height="55" rx="10" fill="#f3f9f5" stroke="#cfe2d6"/>
  <text x="52" y="370" class="txt">Egységes vizuális szabály: a különböző alakú táblák középpontja 58 mm-rel legyen a pálya fölött.</text>
  <text x="52" y="391" class="small">A grafikai jelzés készülhet festéssel, matricával, nyomtatott betéttel vagy egyszerű 3D formával.</text>
</svg>