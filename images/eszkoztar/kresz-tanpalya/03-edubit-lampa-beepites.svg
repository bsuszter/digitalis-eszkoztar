<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">EduBit közlekedési lámpa beépítési méretei tartóval és talppal</title>
  <desc id="desc">Elölnézeti és oldalnézeti műszaki rajz a 20×35 milliméteres lámpatestről, a 10 milliméteres csatlakozórészről, a tartóról, a talpról és a 200 milliméter hosszú vezetékről.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#315f78"/></marker>
    <style>.obj{fill:#eef3f6;stroke:#315f78;stroke-width:2.4}.dark{fill:#35434b;stroke:#263746;stroke-width:2}.holder{fill:#dbeaf2;stroke:#315f78;stroke-width:2.4}.connector{fill:#fff;stroke:#735c9a;stroke-width:2}.dim{stroke:#315f78;stroke-width:1.5;marker-start:url(#arrow);marker-end:url(#arrow)}.ext{stroke:#91a9b8;stroke-width:1}.txt{font:16px Arial,sans-serif;fill:#263746}.small{font:14px Arial,sans-serif;fill:#526773}.head{font:bold 19px Arial,sans-serif;fill:#285a77}.label{font:bold 16px Arial,sans-serif;fill:#604d80}</style>
  </defs>
  <rect x="1" y="1" width="978" height="618" rx="18" fill="#fff" stroke="#d8e2e8"/>
  <text x="34" y="42" class="head">3. EduBit közlekedési lámpa – modul + tartó + talp</text>
  <text x="34" y="68" class="small">A modul méretei adottak. A tartónak stabilan kell rögzítenie a lámpát, a talpnak pedig használhatóvá kell tennie a terepasztalon.</text>

  <g transform="translate(65,115)">
    <text x="78" y="0" class="label">modul elölnézet</text>
    <rect x="80" y="38" width="80" height="140" rx="8" class="dark"/>
    <circle cx="120" cy="69" r="14" fill="#d94a3a"/><circle cx="120" cy="108" r="14" fill="#e0b52d"/><circle cx="120" cy="147" r="14" fill="#5d9c5a"/>
    <rect x="100" y="178" width="40" height="40" class="connector"/>
    <line x1="80" y1="18" x2="160" y2="18" class="dim"/><line x1="80" y1="25" x2="80" y2="38" class="ext"/><line x1="160" y1="25" x2="160" y2="38" class="ext"/><text x="105" y="11" class="txt">20</text>
    <line x1="50" y1="38" x2="50" y2="178" class="dim"/><line x1="58" y1="38" x2="80" y2="38" class="ext"/><line x1="58" y1="178" x2="80" y2="178" class="ext"/><text x="29" y="114" class="txt" transform="rotate(-90 29 114)">35 lámpatest</text>
    <line x1="178" y1="178" x2="178" y2="218" class="dim"/><line x1="140" y1="178" x2="186" y2="178" class="ext"/><line x1="140" y1="218" x2="186" y2="218" class="ext"/><text x="190" y="202" class="txt">10 csatlakozó</text>
  </g>

  <g transform="translate(330,105)">
    <text x="62" y="0" class="label">tartóban, talppal</text>
    <line x1="20" y1="390" x2="270" y2="390" stroke="#263746" stroke-width="3"/>
    <rect x="86" y="70" width="108" height="176" rx="12" class="holder"/>
    <rect x="100" y="84" width="80" height="140" rx="8" class="dark"/>
    <circle cx="140" cy="115" r="14" fill="#d94a3a"/><circle cx="140" cy="154" r="14" fill="#e0b52d"/><circle cx="140" cy="193" r="14" fill="#5d9c5a"/>
    <rect x="120" y="224" width="40" height="40" class="connector"/>
    <rect x="128" y="246" width="24" height="114" class="holder"/>
    <rect x="78" y="360" width="124" height="30" rx="5" class="holder"/>
    <path d="M140 264 C140 290, 190 290, 190 350 C190 365, 215 365, 225 390" fill="none" stroke="#315f78" stroke-width="4"/>
    <line x1="62" y1="224" x2="62" y2="390" class="dim"/><line x1="70" y1="224" x2="100" y2="224" class="ext"/><line x1="70" y1="390" x2="78" y2="390" class="ext"/><text x="40" y="315" class="txt" transform="rotate(-90 40 315)">55 – lámpatest alsó éle</text>
    <line x1="230" y1="84" x2="230" y2="390" class="dim"/><line x1="180" y1="84" x2="238" y2="84" class="ext"/><line x1="202" y1="390" x2="238" y2="390" class="ext"/><text x="242" y="245" class="txt">90 – felső él</text>
    <text x="83" y="420" class="small">A tartó körbeöleli a modult, de a LED-eket szabadon hagyja.</text>
    <text x="83" y="442" class="small">A vezeték a tartón és a talpon át vagy mellett vezethető ki.</text>
  </g>

  <g transform="translate(675,105)">
    <text x="30" y="0" class="label">tartó és talp – tervezési szabályok</text>
    <rect x="75" y="62" width="90" height="170" rx="10" class="holder"/>
    <rect x="91" y="78" width="58" height="138" fill="#fff" stroke="#735c9a" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="108" y="232" width="24" height="112" class="holder"/>
    <rect x="55" y="344" width="130" height="30" rx="5" class="holder"/>
    <line x1="55" y1="396" x2="185" y2="396" class="dim"/><line x1="55" y1="374" x2="55" y2="404" class="ext"/><line x1="185" y1="374" x2="185" y2="404" class="ext"/><text x="76" y="421" class="txt">max. 30 × 30 talp</text>
    <text x="18" y="458" class="small">• talp: kötelező, legfeljebb 30 × 30 mm</text>
    <text x="18" y="480" class="small">• alsó talplemez: 3 mm</text>
    <text x="18" y="502" class="small">• a tartó ne takarja a LED-eket</text>
    <text x="18" y="524" class="small">• a modul vastagságát ténylegesen mérd meg</text>
    <text x="18" y="546" class="small">• a kábel kivezetésének maradjon szabad út</text>
  </g>

  <rect x="34" y="568" width="912" height="34" rx="10" fill="#fff7ef" stroke="#efd2bf"/>
  <text x="52" y="590" class="small">Kötött: modulhelyzet · max. 30×30 mm talp · 3 mm talplemez · szabad LED-ek és kábelút. A tartó formája lehet saját megoldás.</text>
</svg>