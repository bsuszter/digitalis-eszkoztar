<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790" role="img" aria-labelledby="title desc"><title id="title">Három animációs feladat képes forgatókönyve</title><desc id="desc">Három egymás után megjelenő lépés, egy balról érkező szereplő, és két külön dia előtte-utána változással.</desc><rect width="960" height="790" rx="24" fill="#f4f8fb"/><g font-family="Arial,sans-serif"><text x="32" y="43" font-size="24" font-weight="700" fill="#285a77">Mit fog látni a néző a diavetítésben?</text>
<rect x="26" y="65" width="908" height="221" rx="18" fill="white" stroke="#c9d9e8"/><text x="48" y="95" font-size="18" font-weight="bold" fill="#285a77">1. Lépésről lépésre – ugyanaz a dia, három kattintás</text>
<g fill="#e9f4f8" stroke="#9bbfce" stroke-width="2"><rect x="52" y="113" width="253" height="116" rx="12"/><rect x="354" y="113" width="253" height="116" rx="12"/><rect x="655" y="113" width="253" height="116" rx="12"/></g><g font-size="16" fill="#24465a" font-weight="bold" text-anchor="middle"><text x="178" y="142">1. kattintás</text><text x="480" y="142">2. kattintás</text><text x="782" y="142">3. kattintás</text></g><g text-anchor="middle" font-size="19" font-weight="bold"><rect x="74" y="168" width="208" height="43" rx="9" fill="#315f78"/><text x="178" y="196" fill="#fff">1. Tervezz!</text><rect x="369" y="168" width="105" height="43" rx="9" fill="#315f78"/><text x="422" y="196" font-size="12" fill="#fff">1. Tervezz!</text><rect x="479" y="168" width="105" height="43" rx="9" fill="#4f8768"/><text x="532" y="196" font-size="12" fill="#fff">2. Készíts!</text><rect x="668" y="168" width="72" height="43" rx="9" fill="#315f78"/><text x="704" y="196" font-size="11" fill="#fff">Tervezz!</text><rect x="746" y="168" width="72" height="43" rx="9" fill="#4f8768"/><text x="782" y="196" font-size="11" fill="#fff">Készíts!</text><rect x="824" y="168" width="72" height="43" rx="9" fill="#bb8557"/><text x="860" y="196" font-size="11" fill="#fff">Mutasd!</text></g><text x="480" y="260" font-size="15" text-anchor="middle" fill="#667781">A már megjelent elemek a dián maradnak.</text>
<rect x="26" y="303" width="908" height="222" rx="18" fill="white" stroke="#c9d9e8"/><text x="48" y="333" font-size="18" font-weight="bold" fill="#285a77">2. Megérkezik a szereplő – mozgás a dián belül</text><g fill="#f4f9fb" stroke="#9bbfce" stroke-width="2"><rect x="52" y="350" width="394" height="125" rx="12"/><rect x="514" y="350" width="394" height="125" rx="12"/></g><g font-size="15" fill="#667781" text-anchor="middle"><text x="249" y="492">Indulás: a figura a dia mellett</text><text x="711" y="492">Érkezés: a figura a dián</text></g><path d="M459 412h43" stroke="#a97920" stroke-width="4" stroke-linecap="round"/><path d="M493 403l10 9-10 9" fill="none" stroke="#a97920" stroke-width="4"/><g fill="#79b5ca" stroke="#376f93" stroke-width="3"><circle cx="76" cy="399" r="17"/><rect x="62" y="417" width="28" height="36" rx="6"/><circle cx="680" cy="390" r="17"/><rect x="666" y="408" width="28" height="40" rx="6"/></g><path d="M98 434h210" stroke="#4f8768" stroke-width="4" stroke-dasharray="11 9"/><path d="M298 425l12 9-12 9" fill="none" stroke="#4f8768" stroke-width="4"/><path d="M687 434h96" stroke="#4f8768" stroke-width="3" stroke-dasharray="8 6"/><text x="775" y="383" text-anchor="middle" font-size="15" fill="#315f78">Helló!</text>
<rect x="26" y="542" width="908" height="220" rx="18" fill="white" stroke="#c9d9e8"/><text x="48" y="572" font-size="18" font-weight="bold" fill="#285a77">3. Mini történet – két külön dia, köztük áttűnés</text><g fill="#f4f9fb" stroke="#9bbfce" stroke-width="2"><rect x="52" y="591" width="394" height="127" rx="12"/><rect x="514" y="591" width="394" height="127" rx="12"/></g><g font-size="15" font-weight="bold" fill="#24465a"><text x="72" y="615">1. dia: ELŐTTE</text><text x="534" y="615">2. dia: UTÁNA</text></g><path d="M459 650h42" stroke="#a97920" stroke-width="4" stroke-linecap="round"/><path d="M492 641l10 9-10 9" fill="none" stroke="#a97920" stroke-width="4"/><path d="M246 695v-57" stroke="#967558" stroke-width="7"/><path d="M246 655l-30-15m30 26l28-16" stroke="#967558" stroke-width="6" stroke-linecap="round"/><path d="M708 695v-62" stroke="#967558" stroke-width="7"/><path d="M708 661l-34-23m34 31l33-27" stroke="#967558" stroke-width="6" stroke-linecap="round"/><g fill="#6cac78"><circle cx="674" cy="642" r="24"/><circle cx="703" cy="625" r="27"/><circle cx="728" cy="640" r="26"/><circle cx="746" cy="659" r="22"/></g><g fill="#e7a75f"><circle cx="226" cy="696" r="6"/><circle cx="266" cy="696" r="6"/></g><text x="480" y="782" font-size="12" text-anchor="middle" fill="#667781">A nyilak és állapotok magyarázó rajzok; a valódi mozgást a PowerPointban állítod be.</text></g></svg>